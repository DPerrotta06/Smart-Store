<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Store - Self Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .checkout-box {
            max-width: 640px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .scanning { animation: pulse 1.5s infinite; }
        @keyframes pulse { 50% { opacity: 0.6; } }
        @media (prefers-reduced-motion: reduce) { .scanning { animation: none; } }
    </style>
</head>
<body>
<div class="container">
    <div class="checkout-box">
        <h2 class="mb-1">Self Checkout</h2>
        <p class="text-muted">Place all your items near the reader, then scan.</p>

        <button id="scanBtn" class="btn btn-primary w-100 py-2 fw-bold mb-3">Scan items</button>
        <div id="message" class="mb-3" role="status"></div>

        <table class="table align-middle">
            <thead>
                <tr><th>Item</th><th class="text-end">Price</th><th class="text-end">Qty</th><th class="text-end">Total</th><th></th></tr>
            </thead>
            <tbody id="cartBody">
                <tr><td colspan="5" class="text-center text-muted">Your cart is empty. Scan your items to start.</td></tr>
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="3" class="text-end fs-5">Total</th>
                    <th class="text-end fs-5" id="cartTotal">$0.00</th>
                    <th></th>
                </tr>
            </tfoot>
        </table>

        <button id="payBtn" class="btn btn-success w-100 py-2 fw-bold" disabled>Continue to payment</button>
    </div>
</div>

<script>
    const money = n => '$' + Number(n).toFixed(2);
    const cartBody = document.getElementById('cartBody');
    const cartTotal = document.getElementById('cartTotal');
    const payBtn = document.getElementById('payBtn');
    const message = document.getElementById('message');
    const scanBtn = document.getElementById('scanBtn');

    function showMessage(text, kind) {
        message.innerHTML = '';
        if (!text) return;
        const div = document.createElement('div');
        div.className = 'alert alert-' + kind + ' py-2 mb-0';
        div.textContent = text;          // textContent, so tag or product text is never run as HTML
        message.appendChild(div);
    }

    function renderCart(cart) {
        cartBody.innerHTML = '';
        if (cart.items.length === 0) {
            cartBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Your cart is empty. Scan your items to start.</td></tr>';
        }
        cart.items.forEach(item => {
            const tr = document.createElement('tr');
            const cells = [item.name, money(item.unit_price), item.quantity, money(item.line_total)];
            cells.forEach((value, i) => {
                const td = document.createElement('td');
                if (i > 0) td.className = 'text-end';
                td.textContent = value;
                tr.appendChild(td);
            });
            const actionTd = document.createElement('td');
            const btn = document.createElement('button');
            btn.className = 'btn btn-sm btn-outline-danger';
            btn.textContent = 'Remove';
            btn.setAttribute('aria-label', 'Remove ' + item.name);
            btn.addEventListener('click', () => removeItem(item.cart_item_id));
            actionTd.appendChild(btn);
            tr.appendChild(actionTd);
            cartBody.appendChild(tr);
        });
        cartTotal.textContent = money(cart.total);
        payBtn.disabled = cart.items.length === 0;
    }

    async function loadCart() {
        const res = await fetch('/api/cart');
        renderCart(await res.json());
    }

    async function removeItem(id) {
        const res = await fetch('/api/cart/' + id, { method: 'DELETE' });
        const data = await res.json();
        renderCart(data);
        showMessage(res.ok ? 'Item removed.' : data.error, res.ok ? 'secondary' : 'danger');
    }

    scanBtn.addEventListener('click', async () => {
        scanBtn.disabled = true;
        scanBtn.textContent = 'Scanning for about 2 seconds...';
        scanBtn.classList.add('scanning');
        try {
            const res = await fetch('/api/scan', { method: 'POST' });
            const data = await res.json();
            renderCart(data);
            if (data.error) {
                showMessage(data.error, 'danger');
            } else if (data.unknown.length > 0) {
                showMessage(data.unknown.length + ' tag(s) are not in the store catalog and were skipped.', 'warning');
            } else if (data.added.length > 0) {
                showMessage('Added ' + data.added.length + ' item(s): ' + data.added.join(', '), 'success');
            } else {
                showMessage('No new items found. Move your items closer to the reader and try again.', 'info');
            }
        } catch (err) {
            showMessage('Could not reach the server: ' + err, 'danger');
        } finally {
            scanBtn.disabled = false;
            scanBtn.textContent = 'Scan items';
            scanBtn.classList.remove('scanning');
        }
    });

    loadCart();   // show the open cart when the page loads
</script>
</body>
</html>
