<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Store - Self Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .checkout-box {
            max-width: 640px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .scanning { animation: pulse 1.5s infinite; }
        @keyframes pulse { 50% { opacity: 0.6; } }
        @media (prefers-reduced-motion: reduce) { .scanning { animation: none; } }
    </style>
</head>
<body>
<div class="container">
    <div class="checkout-box">
        <h2 class="mb-1">Self Checkout</h2>
        <p class="text-muted">Place all your items near the reader, then scan.</p>

        <button id="scanBtn" class="btn btn-primary w-100 py-2 fw-bold mb-3">Scan items</button>
        <div class="input-group mb-3">
            <input type="text" id="manualEpcInput" class="form-control font-monospace" placeholder="Enter EPC manually..." aria-label="Manual EPC entry">
            <button class="btn btn-outline-primary fw-bold" type="button" id="manualAddBtn">Add Item</button>
        </div>
        <div id="message" class="mb-3" role="status"></div>

        <table class="table align-middle">
            <thead>
                <tr><th>Item</th><th class="text-end">Price</th><th class="text-end">Qty</th><th class="text-end">Total</th><th></th></tr>
            </thead>
            <tbody id="cartBody">
                <tr><td colspan="5" class="text-center text-muted">Your cart is empty. Scan your items to start.</td></tr>
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="3" class="text-end fs-5">Total</th>
                    <th class="text-end fs-5" id="cartTotal">$0.00</th>
                    <th></th>
                </tr>
            </tfoot>
        </table>

        <button id="payBtn" class="btn btn-success w-100 py-2 fw-bold" disabled>Continue to payment</button>
    </div>
</div>

<!-- Mock Payment Modal -->
<div class="modal fade" id="paymentModal" tabindex="-1" aria-labelledby="paymentModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="paymentModalLabel">Complete Checkout</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="paymentForm">
                    <div id="paymentMessage"></div>

                    <div class="mb-4 pb-3 border-bottom">
                        <h6 class="fw-bold text-primary mb-2">Do you have a membership card?</h6>
                        <label for="membershipNumber" class="form-label text-muted small">Enter your Membership Number below, or leave blank to checkout as a guest.</label>
                        <input type="number" min="1" class="form-control font-monospace" id="membershipNumber" placeholder="e.g. 1">
                    </div>

                    <div class="mb-3">
                        <label for="cardNumber" class="form-label fw-bold">Card Number</label>
                        <input type="text" class="form-control font-monospace" id="cardNumber" placeholder="1234 5678 1234 5678" maxlength="19" required>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label for="expiryDate" class="form-label fw-bold">Expiry Date</label>
                            <input type="text" class="form-control font-monospace" id="expiryDate" placeholder="MM/YY" maxlength="5" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label for="cvv" class="form-label fw-bold">CVV</label>
                            <input type="password" class="form-control font-monospace" id="cvv" placeholder="123" maxlength="3" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success fw-bold" id="submitPaymentBtn">Pay Now</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS required for the Modal to function -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const money = n => '$' + Number(n).toFixed(2);
    const cartBody = document.getElementById('cartBody');
    const cartTotal = document.getElementById('cartTotal');
    const payBtn = document.getElementById('payBtn');
    const message = document.getElementById('message');
    const scanBtn = document.getElementById('scanBtn');
    
    // --- Handle Manual EPC Entry ---
    const manualAddBtn = document.getElementById('manualAddBtn');
    const manualEpcInput = document.getElementById('manualEpcInput');

    function showMessage(text, kind) {
        message.innerHTML = '';
        if (!text) return;
        const div = document.createElement('div');
        div.className = 'alert alert-' + kind + ' py-2 mb-0';
        div.textContent = text;
        message.appendChild(div);
    }

    function renderCart(cart) {
        cartBody.innerHTML = '';
        if (cart.items.length === 0) {
            cartBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Your cart is empty. Scan your items to start.</td></tr>';
        }
        cart.items.forEach(item => {
            const tr = document.createElement('tr');
            const cells = [item.name, money(item.unit_price), item.quantity, money(item.line_total)];
            cells.forEach((value, i) => {
                const td = document.createElement('td');
                if (i > 0) td.className = 'text-end';
                td.textContent = value;
                tr.appendChild(td);
            });
            const actionTd = document.createElement('td');
            const btn = document.createElement('button');
            btn.className = 'btn btn-sm btn-outline-danger';
            btn.textContent = 'Remove';
            btn.setAttribute('aria-label', 'Remove ' + item.name);
            btn.addEventListener('click', () => removeItem(item.cart_item_id));
            actionTd.appendChild(btn);
            tr.appendChild(actionTd);
            cartBody.appendChild(tr);
        });
        cartTotal.textContent = money(cart.total);
        payBtn.disabled = cart.items.length === 0;
    }

    async function loadCart() {
        const res = await fetch('/api/cart');
        renderCart(await res.json());
    }

    async function removeItem(id) {
        const res = await fetch('/api/cart/' + id, { method: 'DELETE' });
        const data = await res.json();
        renderCart(data);
        showMessage(res.ok ? 'Item removed.' : data.error, res.ok ? 'secondary' : 'danger');
    }

    scanBtn.addEventListener('click', async () => {
        scanBtn.disabled = true;
        scanBtn.textContent = 'Scanning for about 2 seconds...';
        scanBtn.classList.add('scanning');
        try {
            const res = await fetch('/api/scan', { method: 'POST' });
            const data = await res.json();
            renderCart(data);
            if (data.error) {
                showMessage(data.error, 'danger');
            } else if (data.unknown.length > 0) {
                showMessage(data.unknown.length + ' tag(s) are not in the store catalog and were skipped.', 'warning');
            } else if (data.added.length > 0) {
                showMessage('Added ' + data.added.length + ' item(s): ' + data.added.join(', '), 'success');
            } else {
                showMessage('No new items found. Move your items closer to the reader and try again.', 'info');
            }
        } catch (err) {
            showMessage('Could not reach the server: ' + err, 'danger');
        } finally {
            scanBtn.disabled = false;
            scanBtn.textContent = 'Scan items';
            scanBtn.classList.remove('scanning');
        }
    });

    manualAddBtn.addEventListener('click', async () => {
        const epcValue = manualEpcInput.value.trim();
        
        if (!epcValue) {
            showMessage('Please enter an EPC value.', 'warning');
            return;
        }

        manualAddBtn.disabled = true;
        manualAddBtn.textContent = 'Adding...';

        try {
            const res = await fetch('/api/manual_scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ epc: epcValue })
            });
            
            const data = await res.json();
            renderCart(data);
            
            if (data.error) {
                showMessage(data.error, 'danger');
            } else {
                showMessage('Successfully added: ' + data.added[0], 'success');
                manualEpcInput.value = ''; 
            }
        } catch (err) {
            showMessage('Server error: ' + err, 'danger');
        } finally {
            manualAddBtn.disabled = false;
            manualAddBtn.textContent = 'Add Item';
        }
    });

    manualEpcInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            manualAddBtn.click();
        }
    });

    // --- Handle Payment Modal & Submission ---
    const paymentModal = new bootstrap.Modal(document.getElementById('paymentModal'));
    const paymentMessage = document.getElementById('paymentMessage');

    payBtn.addEventListener('click', () => {
        paymentMessage.innerHTML = '';
        document.getElementById('paymentForm').reset();
        paymentModal.show();
    });

    document.getElementById('submitPaymentBtn').addEventListener('click', async () => {
        // Grab the value from the updated integer Membership Number field
        const membershipNum = document.getElementById('membershipNumber').value.trim();
        const card = document.getElementById('cardNumber').value.replace(/\s/g, '');
        const expiry = document.getElementById('expiryDate').value;
        const cvv = document.getElementById('cvv').value;

        // Validation
        if (!/^\d{16}$/.test(card)) {
            return paymentMessage.innerHTML = '<div class="alert alert-danger py-2">Invalid card number. Must be 16 digits.</div>';
        }
        if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(expiry)) {
            return paymentMessage.innerHTML = '<div class="alert alert-danger py-2">Invalid expiry. Use MM/YY.</div>';
        }
        if (!/^\d{3}$/.test(cvv)) {
            return paymentMessage.innerHTML = '<div class="alert alert-danger py-2">Invalid CVV. Must be 3 digits.</div>';
        }

        const btn = document.getElementById('submitPaymentBtn');
        btn.disabled = true;
        btn.textContent = 'Processing...';

        try {
            const res = await fetch('/api/pay', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    card: card.slice(-4),
                    membership_number: membershipNum // Pass to backend using the new key
                })
            });
            
            const data = await res.json();
            
            if (res.ok) {
                // Save the order to session storage so the next page can display it
                sessionStorage.setItem('lastOrder', JSON.stringify(data.order_summary));
                window.location.href = '/thank_you';
            } else {
                paymentMessage.innerHTML = `<div class="alert alert-danger py-2">${data.error}</div>`;
            }

        } catch (err) {
            paymentMessage.innerHTML = `<div class="alert alert-danger py-2">Server error: ${err}</div>`;
        } finally {
            btn.disabled = false;
            btn.textContent = 'Pay Now';
        }
    });

    loadCart(); 
</script>
</body>
</html>
