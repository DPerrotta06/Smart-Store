<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Store - Thank You</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .receipt-box {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="receipt-box text-center">
        <h1 class="text-success mb-3">🛒 Thank You!</h1>
        <h4 class="text-muted mb-4">Your order has been confirmed.</h4>

        <table class="table text-start align-middle mb-4">
            <thead>
                <tr>
                    <th>Item</th>
                    <th class="text-center">Qty</th>
                    <th class="text-end">Price</th>
                </tr>
            </thead>
            <tbody id="receiptBody">
                <!-- Items will be injected here -->
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="2" class="text-end fs-5 pt-3">Total Paid:</th>
                    <th class="text-end fs-5 text-success pt-3" id="receiptTotal">$0.00</th>
                </tr>
            </tfoot>
        </table>

        <a href="/checkout" class="btn btn-primary w-100 py-2 fw-bold">Start New Checkout</a>
    </div>
</div>

<script>
    // Pull the order data we saved just before redirecting
    const orderData = sessionStorage.getItem('lastOrder');

    if (orderData) {
        const order = JSON.parse(orderData);
        const tbody = document.getElementById('receiptBody');
        
        // Loop through the items and build the table rows
        order.items.forEach(item => {
            const tr = document.createElement('tr');
            
            const nameTd = document.createElement('td');
            nameTd.textContent = item.name;
            
            const qtyTd = document.createElement('td');
            qtyTd.className = 'text-center';
            qtyTd.textContent = item.quantity;
            
            const priceTd = document.createElement('td');
            priceTd.className = 'text-end';
            priceTd.textContent = '$' + (item.price * item.quantity).toFixed(2);
            
            tr.appendChild(nameTd);
            tr.appendChild(qtyTd);
            tr.appendChild(priceTd);
            tbody.appendChild(tr);
        });

        // Set the final total
        document.getElementById('receiptTotal').textContent = '$' + order.total.toFixed(2);
        
        // Clear the storage so it doesn't persist forever
        sessionStorage.removeItem('lastOrder');
    } else {
        // If someone navigates here directly without buying anything
        document.getElementById('receiptBody').innerHTML = '<tr><td colspan="3" class="text-center text-muted">No recent order found.</td></tr>';
    }
</script>
</body>
</html>
