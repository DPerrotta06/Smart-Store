<style>
    .fan-widget { display: inline-block; text-align: center; font-family: sans-serif; }
    .fan-widget svg { width: 100px; height: 100px; }
    .fan-widget .blades { transform-origin: 50px 50px; }
    .fan-widget.on .blades { animation: fan-spin 0.6s linear infinite; }
    .fan-widget .blade { fill: #ffb703; stroke: #222; stroke-width: 2; }
    .fan-widget.off .blade { fill: #bbb; }
    .fan-widget .hub { fill: #fff; stroke: #222; stroke-width: 2; }
    .fan-widget .stand { fill: #222; }
    #fan-status-text { font-weight: bold; margin: 4px 0 0; }
    .fan-widget.on #fan-status-text { color: #2a9d3f; }
    .fan-widget.off #fan-status-text { color: #888; }
    @keyframes fan-spin { to { transform: rotate(360deg); } }
</style>

<div id="fan-widget" class="fan-widget off">
    <svg viewBox="0 0 100 100" aria-label="Fan icon">
        <g class="blades">
            <ellipse class="blade" cx="50" cy="26" rx="9" ry="20"/>
            <ellipse class="blade" cx="50" cy="26" rx="9" ry="20" transform="rotate(120 50 50)"/>
            <ellipse class="blade" cx="50" cy="26" rx="9" ry="20" transform="rotate(240 50 50)"/>
        </g>
        <circle class="hub" cx="50" cy="50" r="7"/>
        <rect class="stand" x="46" y="82" width="8" height="10"/>
        <rect class="stand" x="30" y="92" width="40" height="5" rx="2"/>
    </svg>
    <p id="fan-status-text">Fan: OFF</p>
</div>


<script>
    // Polling: ask the server for the fan status every second and update the icon
    const fanWidget = document.getElementById('fan-widget');
    const fanText = document.getElementById('fan-status-text');

    async function updateFanStatus() {
        try {
            const response = await fetch('/fan/status');
            const data = await response.json();
            const isOn = data.fan === 'ON';
            fanWidget.classList.toggle('on', isOn);
            fanWidget.classList.toggle('off', !isOn);
            fanText.textContent = 'Fan: ' + data.fan;
        } catch (err) {
            fanText.textContent = 'Fan: unknown';
        }
    }

    updateFanStatus();                    // run once immediately
    setInterval(updateFanStatus, 1000);   // then every 1000 ms
</script>
